<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citations — its.flo</title>

  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --subtext: #aaa;
      --card: #111;
      --border: #333;
      --btn: #222;
      --btn-hover: #444;
      --copier: #aaa;
      --copier-hover: #fff;

      --radius: 18px;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --maxw: 1200px;
    }

    body.light {
      --bg: #fff;
      --text: #000;
      --subtext: #555;
      --card: #f1f1f1;
      --border: #ccc;
      --btn: #ddd;
      --btn-hover: #bbb;
      --copier: #333;
      --copier-hover: #000;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: clamp(14px, 2.2vw, 32px);
      transition: background 0.3s ease, color 0.3s ease;
      background-image: radial-gradient(circle at top left, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      font-size: clamp(1.35rem, 2.7vw, 2.5rem);
      margin: 0.5rem auto 0.4rem;
      max-width: var(--maxw);
      line-height: 1.15;
      transition: color 0.35s ease;
      padding: 0 6px;
      cursor: default;
    }
    h1:hover { color: var(--copier-hover); }

    p.subtitle {
      text-align: center;
      color: var(--subtext);
      margin: 0 auto 1.5rem;
      max-width: var(--maxw);
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      padding: 0 6px;
      cursor: default;
    }

    .theme-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 50;
      background: var(--btn);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s ease;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
    }
    .theme-toggle:hover { background: var(--btn-hover); }
    .theme-toggle:active { transform: scale(0.96); }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin: 0 auto 1.2rem;
      max-width: var(--maxw);
      padding: 0 6px;
    }

    .filter-btn {
      background-color: var(--btn);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease;
      font-size: 0.95rem;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background-color: var(--btn-hover);
      font-weight: 700;
    }
    .filter-btn:active { transform: scale(0.98); }

    .search-bar {
      display: flex;
      justify-content: center;
      margin: 0 auto 1.2rem;
      max-width: var(--maxw);
      padding: 0 6px;
    }

    .search-input {
      padding: 0.65rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      width: min(720px, 100%);
      font-size: 1rem;
      transition: border 0.25s, background 0.25s, transform 0.2s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--btn-hover);
      background-color: var(--btn);
      transform: translateY(-1px);
    }

    .random-btn {
      display: block;
      margin: 0 auto 1.5rem;
      background-color: var(--btn);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease;
      box-shadow: var(--shadow);
      -webkit-tap-highlight-color: transparent;
    }
    .random-btn:hover { background-color: var(--btn-hover); }
    .random-btn:active { transform: scale(0.98); }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 6px 20px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem; }
    }
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; }
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      display: flex;
      flex-direction: column;
      transform: translateZ(0);
      transition: transform 0.25s ease, filter 0.25s ease;
      animation: fadeIn 0.35s ease;
    }
    .card:hover {
      transform: scale(1.02);
      filter: brightness(1.06);
    }

    .anime-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 0.28rem 0.55rem;
      font-size: 0.75rem;
      color: var(--text);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      opacity: 0.95;
      transition: transform 0.25s ease, background 0.25s ease;
      pointer-events: none;
      cursor: default;
    }
    body.light .anime-badge {
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(0,0,0,0.10);
    }
    .card:hover .anime-badge {
      transform: scale(1.05);
      background: rgba(0,0,0,0.55);
    }
    body.light .card:hover .anime-badge {
      background: rgba(255,255,255,0.75);
    }

    .image {
      width: 100%;
      aspect-ratio: 16 / 10;
      height: auto;
      object-fit: cover;
      object-position: center;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .citation {
      padding: 1rem 1rem 1.05rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .texte {
      font-style: italic;
      font-size: clamp(1.02rem, 1.6vw, 1.2rem);
      line-height: 1.35;
      margin: 0;
      cursor: default;
    }

    .auteur {
      margin: 0;
      text-align: right;
      color: var(--subtext);
      font-size: 0.98rem;
      cursor: default;
    }

    .copier-btn {
      margin: 0;
      text-align: right;
      font-size: 0.9rem;
      color: var(--copier);
      cursor: pointer;
      text-decoration: underline;
      user-select: none;
      width: fit-content;
      margin-left: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .copier-btn:hover { color: var(--copier-hover); }

    #scrollTop {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: none;
      background: var(--btn);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 0.9rem;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s ease, opacity 0.25s ease;
      animation: floatUp 2s infinite ease-in-out;
      box-shadow: var(--shadow);
      font-size: 1.1rem;
      z-index: 40;
      -webkit-tap-highlight-color: transparent;
    }
    #scrollTop:hover {
      background: var(--btn-hover);
      transform: scale(1.06);
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-10px); opacity: 0.85; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      text-align: center;
      margin: 2.5rem auto 0.5rem;
      font-size: 0.92rem;
      color: var(--subtext);
      max-width: var(--maxw);
      cursor: default;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <button class="theme-toggle" onclick="toggleTheme(this)" aria-label="Changer le thème">☀️</button>

  <h1>« Comprendre le monde, c’est d’abord se comprendre soi. »</h1>
  <p class="subtitle">Un espace d’introspection animé — Its.flo</p>

  <div class="filters">
    <button class="filter-btn active" onclick="filtrer(this, 'tous')">Tous</button>
    <button class="filter-btn" onclick="filtrer(this, 'Classroom of the Elite')">Classroom of the Elite</button>
    <button class="filter-btn" onclick="filtrer(this, 'Naruto')">Naruto</button>
    <button class="filter-btn" onclick="filtrer(this, 'SNK')">Shingeki no Kyojin</button>
    <button class="filter-btn" onclick="filtrer(this, 'JJK')">Jujutsu Kaisen</button>
    <button class="filter-btn" onclick="filtrer(this, 'ReZero')">Re:Zero</button>
    <button class="filter-btn" onclick="filtrer(this, 'One Piece')">One Piece</button>
    <button class="filter-btn" onclick="filtrer(this, 'MHA')">My Hero Academia</button>
    <button class="filter-btn" onclick="filtrer(this, 'Assassination Classroom')">Assassination Classroom</button>
    <button class="filter-btn" onclick="filtrer(this, 'The Seven Deadly Sins')">The Seven Deadly Sins</button>
    <button class="filter-btn" onclick="filtrer(this, 'Parasyte')">Parasyte</button>
    <button class="filter-btn" onclick="filtrer(this, 'Tokyo Ghoul')">Tokyo Ghoul</button>
    <button class="filter-btn" onclick="filtrer(this, 'Death Note')">Death Note</button>
  </div>

  <div class="search-bar">
    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="🔍 Rechercher une citation, un personnage, ou un anime..."
      oninput="rechercherCitation()"
      aria-label="Rechercher"
    />
  </div>

  <button class="random-btn" onclick="afficherCitationAleatoire()">🎲 Citation aléatoire</button>

  <main class="grid" id="citations"></main>

  <button id="scrollTop" onclick="scrollToTop()" aria-label="Retour en haut">⬆️</button>

  <footer>© Its.flo. Tous droits réservés.</footer>

  <script>
    // ✅ Liste complète (celle que tu as donnée)
    const citations = [
      { anime: 'Classroom of the Elite', texte: "«  Les émotions sont inutiles. Ce sont des parasites qui troublent la logique.  »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/d8/ec/97/d8ec978537d140e5e6167c900be9b459.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Ceux qui parlent d’égalité sont généralement les perdants. »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/60/01/8c/60018ce13a38e6715f7ae873837bb05b.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Les émotions peuvent facilement interférer avec une prise de décision logique.  »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/15/1a/d5/151ad55351bfe89a1668b6f9d8f4f340.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Pour atteindre une conclusion rationnelle, il faut d’abord éliminer toutes les émotions. »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/b0/c9/bf/b0c9bfa148376e0182997cd13273289e.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Dans ce monde, dévoiler ses pensées est une faiblesse. Il faut les garder enfouies pour avancer.  »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/77/dd/f5/77ddf5d59d1d8e28c62fdc7597fa86d8.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Peu importe qui est le cerveau… Je vais le traquer et l’écraser. »", auteur: "Ryuen ", image: "https://i.pinimg.com/736x/b3/89/3b/b3893b1a0d31446f9af2a1f53e81a0e3.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Je n’ai besoin de me comparer à personne. Je suis déjà au sommet.. »", auteur: "Koenji", image: "https://i.pinimg.com/736x/52/74/c6/5274c68199f50603d6952a44104cbf89.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Les pions qui se croient rois sont les plus amusants à faire tomber. »", auteur: "Ichika", image: "https://i.pinimg.com/736x/b7/1a/0b/b71a0b6583746e913d150c47abc99ef6.jpg" },

      { anime: 'Naruto', texte: "« Ceux qui ne respectent pas les règles sont des moins que rien… mais ceux qui abandonnent leurs amis sont encore pires. »", auteur: "Kakashi", image: "https://i.pinimg.com/736x/28/14/d3/2814d3f4b243a87d2150363729f3d732.jpg" },
      { anime: 'Naruto', texte: "« Je ne reviendrai jamais sur ma parole… c’est ça, mon nindô ! »", auteur: "Naruto", image: "https://i.pinimg.com/736x/24/96/10/249610c1843051660c0c53af03eb2995.jpg" },
      { anime: 'Naruto', texte: "« La véritable paix ne pourra exister que lorsque tout le monde aura connu la douleur. »", auteur: "Nagato", image: "https://i.pinimg.com/736x/47/8b/f8/478bf8d14dc9acd4193e4163d37d25c4.jpg" },
      { anime: 'Naruto', texte: "« Tant que la haine existe, on ne pourra jamais vraiment se comprendre. »", auteur: "Itachi", image: "https://i.pinimg.com/736x/f2/cc/36/f2cc36f0dc22f0d2156e2f8a40360ec3.jpg" },
      { anime: 'Naruto', texte: "« Tu es fort, car tu sais reconnaître ta douleur. Ceux qui fuient leur souffrance ne peuvent pas grandir.»", auteur: "Itachi", image: "https://i.pinimg.com/736x/9a/0f/30/9a0f30cb4e6fce96b6b738599536c9b8.jpg" },
      { anime: 'Naruto', texte: "« Ce qui compte pour un shinobi, ce n’est pas comment il vit… mais ce pour quoi il meurt.  »", auteur: "Minato", image: "https://i.pinimg.com/736x/14/5d/69/145d6986dcf56bcb313b636aeb3fc7e6.jpg" },
      { anime: 'Naruto', texte: "« Ce monde est régi par la survie du plus fort. Ceux qui ne peuvent pas suivre le rythme sont balayés. »", auteur: "Madara", image: "https://i.pinimg.com/736x/c4/f3/4a/c4f34a623418ef27a173ebe665b87f5d.jpg" },
      { anime: 'Naruto', texte: " « Un véritable perdant est celui qui abandonne ! Tant que je continue à me battre, je ne perdrai jamais ! »", auteur: "Rock Lee", image: "https://i.pinimg.com/736x/81/fc/09/81fc094e46de0b8c9bf2132b7c783c73.jpg" },

      { anime: 'SNK', texte: "« Ce monde est cruel… mais il est aussi très beau.  »", auteur: "Mikasa", image: "https://i.pinimg.com/736x/e0/57/29/e057292f506e47c285e8b5d1a0c8c171.jpg" },
      { anime: 'SNK', texte: "« Si tu veux vivre, alors bats-toi. »", auteur: "Eren", image: "https://i.pinimg.com/736x/ba/5f/8a/ba5f8a3eeb37935c7b74300afcb15317.jpg" },
      { anime: 'SNK', texte: "« Offrez vos cœurs ! Donnez vos vies pour l’avenir de l’humanité !  »", auteur: "Erwin", image: "https://i.pinimg.com/736x/82/9e/e9/829ee956deb1e0217207f647841effe0.jpg" },
      { anime: 'SNK', texte: "« Peu importe combien d’ennemis il y a… je les tuerai tous.  »", auteur: "Levi", image: "https://i.pinimg.com/736x/40/e4/f2/40e4f222740a74b3a284a900e3fdeead.jpg" },
      { anime: 'SNK', texte: "« Si je ne me bats pas, je ne peux rien protéger. »", auteur: "Eren", image: "https://i.pinimg.com/736x/e2/b4/2b/e2b42b6fdeecf62bf45792880428bdff.jpg" },
      { anime: 'SNK', texte: "« Eren… tant que tu es libre… tout va bien. »", auteur: "Mikasa", image: "https://i.pinimg.com/736x/7d/bf/b7/7dbfb7a34055389b0b1e34444656d789.jpg" },
      { anime: 'SNK', texte: "« La vérité, c’est qu’on ne saura jamais si c’était la bonne décision… tant qu’on ne l’a pas prise. »", auteur: "Erwin", image: "https://i.pinimg.com/736x/1f/f9/10/1ff910b5188915f38a4a6b0326b60e39.jpg" },
      { anime: 'SNK', texte: "« Personne ne peut prédire l’issue d’un choix. Alors fais ce que tu crois être juste.  »", auteur: "Levi", image: "https://i.pinimg.com/736x/cc/a3/c3/cca3c3c9db22a0807e366539c6f05719.jpg" },

      { anime: 'JJK', texte: "« Je veux sauver les gens que je considère comme bons. Peu importe si ça semble égoïste. »", auteur: "Megumi", image: "https://i.pinimg.com/736x/6e/76/fe/6e76fe76a3e3f3bdacb79885cf80e068.jpg" },

      { anime: 'JJK', texte: "« Le travail, c’est de la merde. Mais tant qu’on est en vie, il faut le faire.  »", auteur: "Nanami", image: "https://i.pinimg.com/736x/09/fc/86/09fc861cefd7ca660db1aaea4452d215.jpg" },
      { anime: 'JJK', texte: "« Les forts gagnent. Les faibles meurent. C’est tout.  »", auteur: "Toji", image: "https://i.pinimg.com/736x/0e/be/d8/0ebed899927920711239c2ccde4178eb.jpg" },
      { anime: 'JJK', texte: "« Tu penses être un héros ? Tu n’es qu’un insecte pathétique qui implore pour sa vie. »", auteur: "Sukuna", image: "https://i.pinimg.com/736x/5e/2a/d1/5e2ad148d1c22ab99af5940b21f3d5a9.jpg" },

      { anime: 'JJK', texte: "« Peu importe si c’est égoïste… je veux sauver les gens.  »", auteur: "Yuji", image: "https://i.pinimg.com/736x/c0/6d/c1/c06dc1204971428658ab5911ee0954d0.jpg" },

      { anime: 'ReZero', texte: "« Même si je dois mourir encore et encore, je me relèverai… autant de fois qu’il le faudra.  »", auteur: "Subaru", image: "https://i.pinimg.com/736x/76/c1/0c/76c10cd9b1a21a1849a17a0f233c1261.jpg" },

      { anime: 'ReZero', texte: "« Ce monde est rempli de choses que l’on ne peut comprendre qu’en les expérimentant… même si ça doit passer par la mort. »", auteur: "Echidna", image: "https://i.pinimg.com/736x/ca/73/c7/ca73c79317ab148a0d93267c01f5f3b7.jpg" },

      { anime: 'One Piece', texte: "« Seuls les vainqueurs ont le droit de définir ce qui est juste. Les perdants n’ont pas leur mot à dire.  »", auteur : "Doflamingo", image: "https://i.pinimg.com/736x/92/36/20/923620462bdbf8d001f967e6dcc6d73f.jpg" },

    function creerCarte(container, c, isLarge = false) {
      const card = document.createElement('div');
      card.className = 'card';

      if (isLarge) {
        card.style.maxWidth = '760px';
        card.style.margin = '0 auto';
      }

      const badge = document.createElement('div');
      badge.className = 'anime-badge';
      badge.innerText = c.anime;
      card.appendChild(badge);

      const img = new Image();
      img.src = c.image;
      img.className = 'image';
      img.alt = `Image de ${c.auteur} - citation ${c.anime}`;
      img.loading = "lazy";
      img.decoding = "async";
      img.onload = () => { img.style.opacity = '1'; };

      const citationDiv = document.createElement('div');
      citationDiv.className = 'citation';
      citationDiv.innerHTML = `
        <p class="texte">${c.texte}</p>
        <p class="auteur">— ${c.auteur}</p>
        <p class="copier-btn" onclick="copier(${JSON.stringify(c.texte)})">Copier</p>
      `;

      card.appendChild(img);
      card.appendChild(citationDiv);
      container.appendChild(card);
    }

    function afficherCitations(filtre) {
      const container = document.getElementById('citations');
      container.innerHTML = '';
      const list = filtre === 'tous' ? citations : citations.filter(c => c.anime === filtre);
      list.forEach(c => creerCarte(container, c));
    }

    function afficherCitationAleatoire() {
      const container = document.getElementById('citations');
      container.innerHTML = '';
      const randomCitation = citations[Math.floor(Math.random() * citations.length)];
      creerCarte(container, randomCitation, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function copier(text) {
      try {
        await navigator.clipboard.writeText(text);
        alert("Citation copiée !");
      } catch (e) {
        // fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        alert("Citation copiée !");
      }
    }

    function filtrer(button, anime) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      document.getElementById('searchInput').value = '';
      afficherCitations(anime);
    }

    function toggleTheme(button) {
      const body = document.body;
      const isLight = body.classList.toggle('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      button.innerText = isLight ? '🌙' : '☀️';
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop').style.display = window.scrollY > 200 ? 'block' : 'none';
    });

    function rechercherCitation() {
      const input = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('citations');
      container.innerHTML = '';

      const resultats = citations.filter(c =>
        c.texte.toLowerCase().includes(input) ||
        c.auteur.toLowerCase().includes(input) ||
        c.anime.toLowerCase().includes(input)
      );

      resultats.forEach(c => creerCarte(container, c));
    }

    window.addEventListener('load', () => {
      const theme = localStorage.getItem('theme');
      const body = document.body;
      const toggleBtn = document.querySelector('.theme-toggle');

      if (theme === 'light') {
        body.classList.add('light');
        toggleBtn.innerText = '🌙';
      } else {
        toggleBtn.innerText = '☀️';
      }

      afficherCitations('tous');
    });
  </script>
