<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citations — its.flo</title>

  <style>
    :root{
      --bg:#000;
      --text:#fff;
      --subtext:#aaa;
      --card:#111;
      --border:#333;
      --btn:#222;
      --btn-hover:#444;
      --copier:#aaa;
      --copier-hover:#fff;

      --radius:18px;
      --shadow: 0 12px 34px rgba(0,0,0,.35);
      --maxw: 1200px;
      --glass: rgba(255,255,255,.06);
    }
    body.light{
      --bg:#fff;
      --text:#000;
      --subtext:#555;
      --card:#f1f1f1;
      --border:#d0d0d0;
      --btn:#e6e6e6;
      --btn-hover:#d2d2d2;
      --copier:#333;
      --copier-hover:#000;
      --glass: rgba(0,0,0,.05);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background .25s ease, color .25s ease;
      background-image: radial-gradient(circle at top left, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* ===== Layout container ===== */
    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: clamp(14px, 2.2vw, 28px);
      padding-top: 18px;
    }

    /* ===== Sticky header (pratique) ===== */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 100;
      margin: 0 -14px;
      padding: 10px 14px 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,.55), rgba(0,0,0,0));
      backdrop-filter: blur(10px);
    }
    body.light .topbar{
      background: linear-gradient(to bottom, rgba(255,255,255,.92), rgba(255,255,255,.70), rgba(255,255,255,0));
    }

    .toprow{
      display:flex;
      align-items:center;
      gap:10px;
      justify-content: space-between;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 0;
    }
    h1{
      margin:0;
      font-size: clamp(1.1rem, 2.2vw, 1.65rem);
      line-height:1.15;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subtitle{
      margin:0;
      color:var(--subtext);
      font-size: .92rem;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink: 0;
    }

    .iconbtn{
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      cursor:pointer;
      padding: .55rem .8rem;
      box-shadow: var(--shadow);
      transition: background .2s ease, transform .12s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .iconbtn:hover{ background: var(--btn-hover); }
    .iconbtn:active{ transform: scale(.98); }

    /* Search + random = fluid */
    .controls{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:10px;
      margin-top: 10px;
    }
    @media (max-width: 520px){
      .controls{ grid-template-columns: 1fr; }
      .actions .iconbtn{ padding: .52rem .7rem; }
    }

    .search{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .search-input{
      width:100%;
      padding: .70rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border .2s ease, background .2s ease;
      box-shadow: 0 10px 26px rgba(0,0,0,.18);
    }
    .search-input:focus{
      border-color: var(--btn-hover);
      background: var(--btn);
    }

    .random-btn{
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      cursor:pointer;
      padding: .70rem 1rem;
      box-shadow: var(--shadow);
      transition: background .2s ease, transform .12s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .random-btn:hover{ background: var(--btn-hover); }
    .random-btn:active{ transform: scale(.98); }

    /* ===== Filters: horizontal, scrollable (mobile friendly) ===== */
    .filters{
      display:flex;
      gap:10px;
      padding: 12px 0 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar{ display:none; }

    .filter-btn{
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      border-radius: 999px;
      cursor:pointer;
      padding: .55rem .95rem;
      transition: background .2s ease, transform .12s ease;
      -webkit-tap-highlight-color: transparent;
      font-size: .95rem;
      white-space: nowrap;
    }
    .filter-btn:hover{ background: var(--btn); }
    .filter-btn.active{
      background: var(--btn-hover);
      font-weight: 700;
    }
    .filter-btn:active{ transform: scale(.98); }

    /* ===== Result info ===== */
    .meta{
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap:12px;
      margin: 10px 0 14px;
      color: var(--subtext);
      font-size: .95rem;
    }
    .meta strong{ color: var(--text); }
    .clear-btn{
      border:none;
      background: transparent;
      color: var(--subtext);
      cursor:pointer;
      text-decoration: underline;
      padding: 6px 0;
    }
    .clear-btn:hover{ color: var(--text); }

    /* ===== Grid: plus fluide PC/tel ===== */
    .grid{
      display:grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 14px;
      padding-bottom: 22px;
    }
    @media (min-width: 640px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
    @media (min-width: 980px){
      .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    }
    @media (min-width: 1240px){
      .grid{ grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    /* ===== Card: plus compacte & pratique ===== */
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      display:flex;
      flex-direction: column;
      transition: transform .22s ease, filter .22s ease;
      animation: fadeIn .25s ease;
      min-height: 100%;
    }
    .card:hover{
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .anime-badge{
      position:absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,.38);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      padding: .28rem .55rem;
      border-radius: 10px;
      font-size: .75rem;
      backdrop-filter: blur(10px);
      pointer-events:none;
      opacity: .95;
    }
    body.light .anime-badge{
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(0,0,0,.10);
    }

    .image{
      width:100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      object-position: center;
      display:block;
      opacity: 0;
      transition: opacity .6s ease;
    }

    .citation{
      padding: 12px 12px 12px;
      display:flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .texte{
      margin:0;
      font-style: italic;
      font-size: clamp(1.02rem, 1.4vw, 1.15rem);
      line-height: 1.35;
      cursor: default;
    }

    .bottomrow{
      display:flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    .auteur{
      margin:0;
      color: var(--subtext);
      font-size: .98rem;
      cursor: default;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn{
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      cursor:pointer;
      padding: .45rem .75rem;
      font-size: .90rem;
      transition: background .2s ease, transform .12s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .copy-btn:hover{ background: var(--btn-hover); }
    .copy-btn:active{ transform: scale(.98); }

    /* ===== Scroll top ===== */
    #scrollTop{
      position: fixed;
      bottom: 18px;
      right: 18px;
      display:none;
      background: var(--btn);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .72rem .92rem;
      border-radius: 50%;
      cursor:pointer;
      box-shadow: var(--shadow);
      transition: background .2s ease, transform .12s ease, opacity .2s ease;
      z-index: 80;
      -webkit-tap-highlight-color: transparent;
    }
    #scrollTop:hover{ background: var(--btn-hover); transform: scale(1.05); }

    footer{
      text-align:center;
      color: var(--subtext);
      font-size: .92rem;
      padding: 18px 0 26px;
      cursor: default;
    }

    /* toast (copie) */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: .55rem .9rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events:none;
      transition: opacity .25s ease, transform .25s ease;
      z-index: 200;
      font-size: .95rem;
    }
    body.light .toast{
      background: rgba(0,0,0,.80);
      color: #fff;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="toprow">
        <div class="brand">
          <h1>« Comprendre le monde, c’est d’abord se comprendre soi. »</h1>
          <p class="subtitle">Un espace d’introspection animé — Its.flo</p>
        </div>

        <div class="actions">
          <button class="iconbtn" onclick="toggleTheme(this)" aria-label="Changer le thème">☀️</button>
        </div>
      </div>

      <div class="controls">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="🔍 Rechercher une citation, un perso, ou un anime..."
          oninput="rechercherCitation()"
          aria-label="Rechercher"
        />
        <button class="random-btn" onclick="afficherCitationAleatoire()">🎲 Aléatoire</button>
      </div>

      <div class="filters" id="filters">
        <button class="filter-btn active" onclick="filtrer(this, 'tous')">Tous</button>
        <button class="filter-btn" onclick="filtrer(this, 'Classroom of the Elite')">Classroom of the Elite</button>
        <button class="filter-btn" onclick="filtrer(this, 'Naruto')">Naruto</button>
        <button class="filter-btn" onclick="filtrer(this, 'SNK')">Shingeki no Kyojin</button>
        <button class="filter-btn" onclick="filtrer(this, 'JJK')">Jujutsu Kaisen</button>
        <button class="filter-btn" onclick="filtrer(this, 'ReZero')">Re:Zero</button>
        <button class="filter-btn" onclick="filtrer(this, 'One Piece')">One Piece</button>
        <button class="filter-btn" onclick="filtrer(this, 'MHA')">My Hero Academia</button>
        <button class="filter-btn" onclick="filtrer(this, 'Assassination Classroom')">Assassination Classroom</button>
        <button class="filter-btn" onclick="filtrer(this, 'The Seven Deadly Sins')">The Seven Deadly Sins</button>
        <button class="filter-btn" onclick="filtrer(this, 'Parasyte')">Parasyte</button>
        <button class="filter-btn" onclick="filtrer(this, 'Tokyo Ghoul')">Tokyo Ghoul</button>
        <button class="filter-btn" onclick="filtrer(this, 'Death Note')">Death Note</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="meta">
      <div id="metaText">Affichage : <strong id="countText">0</strong> citations</div>
      <button class="clear-btn" onclick="resetAll()">Réinitialiser</button>
    </div>

    <main class="grid" id="citations"></main>

    <button id="scrollTop" onclick="scrollToTop()" aria-label="Retour en haut">⬆️</button>

    <footer>© Its.flo. Tous droits réservés.</footer>
  </div>

  <div class="toast" id="toast">Copié ✅</div>

  <script>
    const citations = [
      { anime: 'Classroom of the Elite', texte: "«  Les émotions sont inutiles. Ce sont des parasites qui troublent la logique.  »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/d8/ec/97/d8ec978537d140e5e6167c900be9b459.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Ceux qui parlent d’égalité sont généralement les perdants. »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/60/01/8c/60018ce13a38e6715f7ae873837bb05b.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Les émotions peuvent facilement interférer avec une prise de décision logique.  »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/15/1a/d5/151ad55351bfe89a1668b6f9d8f4f340.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Pour atteindre une conclusion rationnelle, il faut d’abord éliminer toutes les émotions. »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/b0/c9/bf/b0c9bfa148376e0182997cd13273289e.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Dans ce monde, dévoiler ses pensées est une faiblesse. Il faut les garder enfouies pour avancer.  »", auteur: "Ayanokoji", image: "https://i.pinimg.com/736x/77/dd/f5/77ddf5d59d1d8e28c62fdc7597fa86d8.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Peu importe qui est le cerveau… Je vais le traquer et l’écraser. »", auteur: "Ryuen ", image: "https://i.pinimg.com/736x/b3/89/3b/b3893b1a0d31446f9af2a1f53e81a0e3.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Je n’ai besoin de me comparer à personne. Je suis déjà au sommet.. »", auteur: "Koenji", image: "https://i.pinimg.com/736x/52/74/c6/5274c68199f50603d6952a44104cbf89.jpg" },
      { anime: 'Classroom of the Elite', texte: "« Les pions qui se croient rois sont les plus amusants à faire tomber. »", auteur: "Ichika", image: "https://i.pinimg.com/736x/b7/1a/0b/b71a0b6583746e913d150c47abc99ef6.jpg" },

      { anime: 'Naruto', texte: "« Ceux qui ne respectent pas les règles sont des moins que rien… mais ceux qui abandonnent leurs amis sont encore pires. »", auteur: "Kakashi", image: "https://i.pinimg.com/736x/28/14/d3/2814d3f4b243a87d2150363729f3d732.jpg" },
      { anime: 'Naruto', texte: "« Je ne reviendrai jamais sur ma parole… c’est ça, mon nindô ! »", auteur: "Naruto", image: "https://i.pinimg.com/736x/24/96/10/249610c1843051660c0c53af03eb2995.jpg" },
      { anime: 'Naruto', texte: "« La véritable paix ne pourra exister que lorsque tout le monde aura connu la douleur. »", auteur: "Nagato", image: "https://i.pinimg.com/736x/47/8b/f8/478bf8d14dc9acd4193e4163d37d25c4.jpg" },
      { anime: 'Naruto', texte: "« Tant que la haine existe, on ne pourra jamais vraiment se comprendre. »", auteur: "Itachi", image: "https://i.pinimg.com/736x/f2/cc/36/f2cc36f0dc22f0d2156e2f8a40360ec3.jpg" },
      { anime: 'Naruto', texte: "« Tu es fort, car tu sais reconnaître ta douleur. Ceux qui fuient leur souffrance ne peuvent pas grandir.»", auteur: "Itachi", image: "https://i.pinimg.com/736x/9a/0f/30/9a0f30cb4e6fce96b6b738599536c9b8.jpg" },
      { anime: 'Naruto', texte: "« Ce qui compte pour un shinobi, ce n’est pas comment il vit… mais ce pour quoi il meurt.  »", auteur: "Minato", image: "https://i.pinimg.com/736x/14/5d/69/145d6986dcf56bcb313b636aeb3fc7e6.jpg" },
      { anime: 'Naruto', texte: "« Ce monde est régi par la survie du plus fort. Ceux qui ne peuvent pas suivre le rythme sont balayés. »", auteur: "Madara", image: "https://i.pinimg.com/736x/c4/f3/4a/c4f34a623418ef27a173ebe665b87f5d.jpg" },
      { anime: 'Naruto', texte: " « Un véritable perdant est celui qui abandonne ! Tant que je continue à me battre, je ne perdrai jamais ! »", auteur: "Rock Lee", image: "https://i.pinimg.com/736x/81/fc/09/81fc094e46de0b8c9bf2132b7c783c73.jpg" },

      { anime: 'SNK', texte: "« Ce monde est cruel… mais il est aussi très beau.  »", auteur: "Mikasa", image: "https://i.pinimg.com/736x/e0/57/29/e057292f506e47c285e8b5d1a0c8c171.jpg" },
      { anime: 'SNK', texte: "« Si tu veux vivre, alors bats-toi. »", auteur: "Eren", image: "https://i.pinimg.com/736x/ba/5f/8a/ba5f8a3eeb37935c7b74300afcb15317.jpg" },
      { anime: 'SNK', texte: "« Offrez vos cœurs ! Donnez vos vies pour l’avenir de l’humanité !  »", auteur: "Erwin", image: "https://i.pinimg.com/736x/82/9e/e9/829ee956deb1e0217207f647841effe0.jpg" },
      { anime: 'SNK', texte: "« Peu importe combien d’ennemis il y a… je les tuerai tous.  »", auteur: "Levi", image: "https://i.pinimg.com/736x/40/e4/f2/40e4f222740a74b3a284a900e3fdeead.jpg" },
      { anime: 'SNK', texte: "« Si je ne me bats pas, je ne peux rien protéger. »", auteur: "Eren", image: "https://i.pinimg.com/736x/e2/b4/2b/e2b42b6fdeecf62bf45792880428bdff.jpg" },
      { anime: 'SNK', texte: "« Eren… tant que tu es libre… tout va bien. »", auteur: "Mikasa", image: "https://i.pinimg.com/736x/7d/bf/b7/7dbfb7a34055389b0b1e34444656d789.jpg" },
      { anime: 'SNK', texte: "« La vérité, c’est qu’on ne saura jamais si c’était la bonne décision… tant qu’on ne l’a pas prise. »", auteur: "Erwin", image: "https://i.pinimg.com/736x/1f/f9/10/1ff910b5188915f38a4a6b0326b60e39.jpg" },
      { anime: 'SNK', texte: "« Personne ne peut prédire l’issue d’un choix. Alors fais ce que tu crois être juste.  »", auteur: "Levi", image: "https://i.pinimg.com/736x/cc/a3/c3/cca3c3c9db22a0807e366539c6f05719.jpg" },

      { anime: 'JJK', texte: "« Je veux sauver les gens que je considère comme bons. Peu importe si ça semble égoïste. »", auteur: "Megumi", image: "https://i.pinimg.com/736x/6e/76/fe/6e76fe76a3e3f3bdacb79885cf80e068.jpg" },
      { anime: 'JJK', texte: "« Je sais que je suis faible… mais c’est justement pour ça que je ne peux pas reculer.  »", auteur: "Yuji", image: "https://i.pinimg.com/736x/26/4c/c2/264cc2057b0d8a7222184ab5c7e9de85.jpg" },
      { anime: 'JJK', texte: "« Mourir sans but… c’est le vrai gâchis.  »", auteur: "Gojo", image: "https://i.pinimg.com/736x/b1/6a/0f/b16a0f9e4d6f54edadd63f512f6d61a8.jpg" },
      { anime: 'JJK', texte: "« Le travail, c’est de la merde. Mais tant qu’on est en vie, il faut le faire.  »", auteur: "Nanami", image: "https://i.pinimg.com/736x/09/fc/86/09fc861cefd7ca660db1aaea4452d215.jpg" },
      { anime: 'JJK', texte: "« Les forts gagnent. Les faibles meurent. C’est tout.  »", auteur: "Toji", image: "https://i.pinimg.com/736x/0e/be/d8/0ebed899927920711239c2ccde4178eb.jpg" },
      { anime: 'JJK', texte: "« Tu penses être un héros ? Tu n’es qu’un insecte pathétique qui implore pour sa vie. »", auteur: "Sukuna", image: "https://i.pinimg.com/736x/5e/2a/d1/5e2ad148d1c22ab99af5940b21f3d5a9.jpg" },
      { anime: 'JJK', texte: "« Si les puissants ne protègent pas les faibles… qui le fera ?  »", auteur: "Gojo", image: "https://i.pinimg.com/736x/b9/66/8b/b9668b8233a769967e4ba7cdf0e0d3bf.jpg" },
      { anime: 'JJK', texte: "« Peu importe si c’est égoïste… je veux sauver les gens.  »", auteur: "Yuji", image: "https://i.pinimg.com/736x/c0/6d/c1/c06dc1204971428658ab5911ee0954d0.jpg" },

    let activeAnime = 'tous';

    function setMeta(n){
      document.getElementById('countText').textContent = n;
    }

    function toast(msg="Copié ✅"){
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove('show'), 1100);
    }

    function creerCarte(container, c, isLarge = false){
      const card = document.createElement('div');
      card.className = 'card';

      if (isLarge){
        card.style.gridColumn = '1 / -1';
      }

      const badge = document.createElement('div');
      badge.className = 'anime-badge';
      badge.innerText = c.anime;

      const img = new Image();
      img.src = c.image;
      img.className = 'image';
      img.alt = `Image de ${c.auteur} - citation ${c.anime}`;
      img.loading = "lazy";
      img.decoding = "async";
      img.onload = () => img.style.opacity = '1';

      const citationDiv = document.createElement('div');
      citationDiv.className = 'citation';

      const pTexte = document.createElement('p');
      pTexte.className = 'texte';
      pTexte.textContent = c.texte;

      const bottom = document.createElement('div');
      bottom.className = 'bottomrow';

      const pAuteur = document.createElement('p');
      pAuteur.className = 'auteur';
      pAuteur.textContent = "— " + c.auteur;

      const copy = document.createElement('button');
      copy.className = 'copy-btn';
      copy.type = 'button';
      copy.textContent = 'Copier';
      copy.addEventListener('click', () => copier(c.texte));

      bottom.appendChild(pAuteur);
      bottom.appendChild(copy);

      citationDiv.appendChild(pTexte);
      citationDiv.appendChild(bottom);

      card.appendChild(badge);
      card.appendChild(img);
      card.appendChild(citationDiv);
      container.appendChild(card);
    }

    function getFilteredList(){
      const input = document.getElementById('searchInput').value.toLowerCase().trim();

      let list = (activeAnime === 'tous')
        ? citations
        : citations.filter(c => c.anime === activeAnime);

      if (input){
        list = list.filter(c =>
          c.texte.toLowerCase().includes(input) ||
          c.auteur.toLowerCase().includes(input) ||
          c.anime.toLowerCase().includes(input)
        );
      }
      return list;
    }

    function render(){
      const container = document.getElementById('citations');
      container.innerHTML = '';
      const list = getFilteredList();
      list.forEach(c => creerCarte(container, c));
      setMeta(list.length);
    }

    function afficherCitationAleatoire(){
      const container = document.getElementById('citations');
      container.innerHTML = '';
      const list = getFilteredList();
      const pick = list.length ? list[Math.floor(Math.random() * list.length)] : null;
      if (!pick){
        setMeta(0);
        toast("Aucun résultat");
        return;
      }
      creerCarte(container, pick, true);
      setMeta(1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function copier(text){
      try{
        await navigator.clipboard.writeText(text);
        toast("Copié ✅");
      }catch(e){
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        toast("Copié ✅");
      }
    }

    function filtrer(button, anime){
      activeAnime = anime;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      render();
    }

    function rechercherCitation(){
      render();
    }

    function resetAll(){
      activeAnime = 'tous';
      document.getElementById('searchInput').value = '';

      // remettre "Tous" actif
      const btnTous = document.querySelector('.filters .filter-btn');
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnTous.classList.add('active');

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTheme(button){
      const body = document.body;
      const isLight = body.classList.toggle('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      button.textContent = isLight ? '🌙' : '☀️';
    }

    function scrollToTop(){
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const el = document.getElementById('scrollTop');
      el.style.display = window.scrollY > 240 ? 'block' : 'none';
    });

    window.addEventListener('load', () => {
      const theme = localStorage.getItem('theme');
      const btn = document.querySelector('.iconbtn');

      if (theme === 'light'){
        document.body.classList.add('light');
        btn.textContent = '🌙';
      } else {
        btn.textContent = '☀️';
      }

      render();
    });
  </script>
